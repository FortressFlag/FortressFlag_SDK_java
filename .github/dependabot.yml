# Weekly, grouped, labeled. The gradle entry watches the wrapper and the test-only
# dependency block: the runtime dependency policy is ZERO dependencies (ADR-0020) and CI
# greps build.gradle.kts to enforce it. Watching the dev/test tree is still SOC 2 CC7.1
# hygiene — the toolchain builds what ships.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      dev:
        patterns: ["*"]
